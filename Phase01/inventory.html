<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Catalog</title>

    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/inventory.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/phosphor-all.css">
    <meta name="view-transition" content="same-origin">
</head>

<body>

    <div class="container">

        <!-- Sidebar -->
        <app-sidebar></app-sidebar>

        <!-- Main Content -->
        <main class="main-content">

            <!-- Topbar -->
            <app-topbar></app-topbar>

            <!-- Page Content Inner -->
            <div class="page-inner">

                <!-- Page Header -->
                <div class="inv-page-head">
                    <div>
                        <p>Real-time product management, pricing, stock levels, and instant database sync across all modules.</p>
                    </div>
                    <div class="inv-header-actions">
                        <button class="btn btn-outline" id="export-btn">
                            <i class="ph ph-download-simple"></i> Export CSV
                        </button>
                        <a class="btn btn-gradient" href="add-product.html">
                            <i class="ph ph-plus"></i> Add New Product
                        </a>
                    </div>
                </div>

                <!-- Toolbar: Search + Filters -->
                <div class="inv-toolbar">
                    <div class="search-field">
                        <i class="ph ph-magnifying-glass"></i>
                        <input id="inv-search" type="text" placeholder="Search product name, SKU, or barcode...">
                    </div>
                    
                    <span class="toolbar-label">Category</span>
                    <select id="filter-category"><option value="">All Categories</option></select>
                    
                    <span class="toolbar-label">Supplier</span>
                    <select id="filter-supplier"><option value="">All Suppliers</option></select>
                    
                    <span class="toolbar-label">Status</span>
                    <select id="filter-status"><option value="">All Status</option></select>
                </div>

                <!-- Products Table Panel -->
                <div class="inv-panel">
                    <div class="inv-table-wrap">
                        <table class="inv-data-table data-table">
                            <thead>
                                <tr>
                                    <th class="sortable" data-sort="name">Product</th>
                                    <th class="sortable" data-sort="category">Category</th>
                                    <th>Supplier</th>
                                    <th class="num sortable" data-sort="costPrice">Cost</th>
                                    <th class="num sortable" data-sort="sellingPrice">Selling</th>
                                    <th class="num sortable" data-sort="stock">Stock</th>
                                    <th class="num sortable" data-sort="reorderPoint">Reorder Pt</th>
                                    <th class="sortable" data-sort="status">Status</th>
                                    <th style="text-align: right;">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="inv-tbody"></tbody>
                        </table>
                    </div>

                    <!-- Pagination -->
                    <div class="pagination" id="inv-pagination" style="margin-top: 16px;"></div>
                </div>

            </div>
        </main>
    </div>

    <!-- ===== Edit Product Modal ===== -->
    <div class="modal-backdrop" id="edit-modal">
        <div class="modal">
            <div class="modal-head">
                <h3>Edit Product</h3>
                <button class="modal-close" data-close>&times;</button>
            </div>
            <div class="modal-body">
                <datalist id="category-list"></datalist>
                <div class="form-grid2">
                    <div class="field full-width">
                        <label>Product Name</label>
                        <input id="edit-name" type="text">
                        <div class="field-error"></div>
                    </div>
                    <div class="field">
                        <label>SKU</label>
                        <input id="edit-sku" type="text">
                        <div class="field-error"></div>
                    </div>
                    <div class="field">
                        <label>Barcode</label>
                        <input id="edit-barcode" type="text">
                        <div class="field-error"></div>
                    </div>
                    <div class="field">
                        <label>Category</label>
                        <input id="edit-category" type="text" list="category-list">
                        <div class="field-error"></div>
                    </div>
                    <div class="field">
                        <label>Supplier</label>
                        <input id="edit-supplier" type="text">
                        <div class="field-error"></div>
                    </div>
                    <div class="field">
                        <label>Cost Price ($)</label>
                        <input id="edit-cost" type="number" min="0" step="0.01">
                        <div class="field-error"></div>
                    </div>
                    <div class="field">
                        <label>Selling Price ($)</label>
                        <input id="edit-selling" type="number" min="0" step="0.01">
                        <div class="field-error"></div>
                    </div>
                    <div class="field">
                        <label>Stock Quantity</label>
                        <input id="edit-stock" type="number" min="0">
                        <div class="field-error"></div>
                    </div>
                    <div class="field">
                        <label>Safety Stock Buffer</label>
                        <input id="edit-safety" type="number" min="0">
                        <div class="field-error"></div>
                    </div>
                    <div class="field full-width">
                        <label>Supplier Lead Time (Days)</label>
                        <input id="edit-lead" type="number" min="1">
                        <div class="field-error"></div>
                    </div>
                    <div class="field full-width">
                        <label>Description</label>
                        <textarea id="edit-description" rows="3"></textarea>
                    </div>
                </div>
            </div>
            <div class="modal-foot">
                <button class="btn btn-outline" data-close>Cancel</button>
                <button class="btn btn-gradient" id="edit-save"><i class="ph ph-check"></i> Save Changes</button>
            </div>
        </div>
    </div>

    <!-- ===== Update Stock Modal ===== -->
    <div class="modal-backdrop" id="stock-modal">
        <div class="modal modal-sm" style="max-width: 440px;">
            <div class="modal-head">
                <h3>Update Stock Level</h3>
                <button class="modal-close" data-close>&times;</button>
            </div>
            <div class="modal-body">
                <p id="stock-product-name" style="margin-bottom: 14px; font-size: 13px; color: #94a3b8;"></p>
                <div class="field">
                    <label>New Stock Quantity</label>
                    <input id="stock-new-value" type="number" min="0">
                    <div class="field-error"></div>
                </div>
            </div>
            <div class="modal-foot">
                <button class="btn btn-outline" data-close>Cancel</button>
                <button class="btn btn-gradient" id="stock-save"><i class="ph ph-check"></i> Update Stock</button>
            </div>
        </div>
    </div>

    <script src="js/utils.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/validation.js"></script>
    <script src="js/inventory.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/topbar.js"></script>
</body>
</html>
