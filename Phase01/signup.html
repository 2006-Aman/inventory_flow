<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>

    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/phosphor-all.css">
    <meta name="view-transition" content="same-origin">
</head>

<body class="auth-body">

    <div class="auth-card">
        <div class="auth-logo">
            <a href="index.html" class="auth-logo-link" title="Go to Home">
                <div class="logo-icon" title="InventoryIQ">
                    <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="iq-grad-signup" x1="0" y1="0" x2="1" y2="1">
                                <stop offset="0" stop-color="#38bdf8"/>
                                <stop offset="0.5" stop-color="#0ea5e9"/>
                                <stop offset="1" stop-color="#6366f1"/>
                            </linearGradient>
                        </defs>
                        <rect x="2" y="2" width="36" height="36" rx="11" fill="url(#iq-grad-signup)"/>
                        <rect x="2.5" y="2.5" width="35" height="35" rx="10.5" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1"/>
                        <rect x="9.5" y="21" width="4.5" height="8" rx="1.5" fill="#ffffff" fill-opacity="0.5"/>
                        <rect x="17" y="16" width="4.5" height="13" rx="1.5" fill="#ffffff" fill-opacity="0.8"/>
                        <rect x="24.5" y="10" width="4.5" height="19" rx="1.5" fill="#ffffff"/>
                        <path d="M 8.5 25 Q 16 19 24.5 13 T 32 8" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none"/>
                        <circle cx="32" cy="8" r="2.8" fill="#38bdf8" stroke="#ffffff" stroke-width="1.2"/>
                    </svg>
                </div>
                <h1>Create Account</h1>
            </a>
            <p>Join InventoryIQ</p>
        </div>

        <div class="auth-error-banner" id="auth-error"></div>

        <form class="auth-form" id="signup-form" novalidate>
            <div class="field">
                <label>Full name</label>
                <input id="signup-name" type="text" placeholder="Your name">
            </div>
            <div class="field">
                <label>Email</label>
                <input id="signup-email" type="email" placeholder="you@company.com">
            </div>
            <div class="field">
                <label>Password</label>
                <div class="password-wrapper">
                    <input id="signup-password" type="password" placeholder="Create a strong password">
                    <button type="button" class="eye-toggle" data-target="signup-password" aria-label="Toggle password visibility">
                        <i class="ph ph-eye"></i>
                    </button>
                </div>
                <ul class="pw-requirements" id="pw-requirements">
                    <li id="req-length"><i class="ph ph-circle"></i> At least 8 characters</li>
                    <li id="req-upper"><i class="ph ph-circle"></i> At least one uppercase letter</li>
                    <li id="req-number"><i class="ph ph-circle"></i> At least one numeric digit</li>
                    <li id="req-special"><i class="ph ph-circle"></i> At least one special character</li>
                </ul>
            </div>
            <div class="field">
                <label>Confirm password</label>
                <div class="password-wrapper">
                    <input id="signup-confirm" type="password" placeholder="Repeat your password">
                    <button type="button" class="eye-toggle" data-target="signup-confirm" aria-label="Toggle password visibility">
                        <i class="ph ph-eye"></i>
                    </button>
                </div>
            </div>
            <button class="btn btn-gradient" type="submit"><i class="ph ph-user-check"></i> Create Account</button>
        </form>

        <p class="auth-alt">Already have an account? <a href="login.html">Sign in</a></p>
    </div>

    <script src="js/utils.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/validation.js"></script>
    <script src="js/auth.js"></script>
    <script>
        initSignupPage();
        initPasswordToggles();
        initPasswordRequirements();
    </script>
</body>
</html>
