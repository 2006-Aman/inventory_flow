<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>

    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <meta name="view-transition" content="same-origin">
</head>

<body class="auth-body">

    <div class="auth-card">
        <div class="auth-logo">
            <div class="logo-badge"><i class="ph ph-user-plus"></i></div>
            <h1>Create Account</h1>
            <p>Join InventoryIQ</p>
        </div>

        <div class="auth-error-banner" id="auth-error"></div>

        <form class="auth-form" id="signup-form" novalidate>
            <div class="field">
                <label>Full name</label>
                <input id="signup-name" type="text" placeholder="Your name">
            </div>
            <div class="field">
                <label>Email</label>
                <input id="signup-email" type="email" placeholder="you@company.com">
            </div>
            <div class="field">
                <label>Password</label>
                <input id="signup-password" type="password" placeholder="At least 6 characters">
            </div>
            <div class="field">
                <label>Confirm password</label>
                <input id="signup-confirm" type="password" placeholder="Repeat your password">
            </div>
            <button class="btn btn-gradient" type="submit"><i class="ph ph-user-check"></i> Create Account</button>
        </form>

        <p class="auth-alt">Already have an account? <a href="login.html">Sign in</a></p>
    </div>

    <script src="js/utils.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/validation.js"></script>
    <script src="js/auth.js"></script>
    <script>
        initSignupPage();
    </script>
</body>
</html>
